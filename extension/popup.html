<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 260px;
        margin: 0;
        padding: 14px;
        background: #101014;
        color: #f5f5f7;
        font-family: Helvetica, Arial, sans-serif;
        font-size: 13px;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      label {
        display: block;
        font-size: 11px;
        color: #9a9aa5;
        margin: 8px 0 3px;
      }
      input {
        width: 100%;
        padding: 7px 8px;
        border-radius: 7px;
        border: 1px solid #2c2c35;
        background: #1a1a20;
        color: #f5f5f7;
        font-size: 12px;
      }
      button {
        width: 100%;
        margin-top: 12px;
        padding: 9px;
        border: 0;
        border-radius: 8px;
        background: #e50914;
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }
      button.secondary {
        background: #2a2a33;
        font-weight: 600;
        margin-top: 6px;
      }
      details {
        margin-top: 10px;
      }
      summary {
        font-size: 11px;
        color: #9a9aa5;
        cursor: pointer;
      }
      #msg {
        margin-top: 8px;
        font-size: 11px;
        color: #9a9aa5;
        min-height: 14px;
      }
    </style>
  </head>
  <body>
    <h1>Plixteam</h1>
    <label for="name">Your name</label>
    <input id="name" placeholder="Me" />
    <label for="room">Room code (share this)</label>
    <input id="room" placeholder="movie-night" />
    <details>
      <summary>Advanced</summary>
      <label for="server">Signaling server</label>
      <input id="server" placeholder="wss://your-server/ws" />
      <label for="turnUrl">TURN url (optional)</label>
      <input id="turnUrl" placeholder="turn:host:3478" />
      <label for="turnUser">TURN user</label>
      <input id="turnUser" />
      <label for="turnPass">TURN password</label>
      <input id="turnPass" type="password" />
    </details>
    <button id="join">Start party</button>
    <button id="leave" class="secondary">Leave party</button>
    <button id="perms" class="secondary">Grant camera &amp; mic</button>
    <div id="msg"></div>
    <script src="popup.js"></script>
  </body>
</html>
